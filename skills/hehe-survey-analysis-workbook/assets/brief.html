<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--ink:#24465e;--teal:#218b91;--text:#293d4a;--muted:#657986;--line:#d4dee4;--pale:#f0f5f7;--paper:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:0}body{margin:0;background:#edf2f5;color:var(--text);font:16px/1.85 "Microsoft YaHei","Noto Sans SC",sans-serif;padding-left:268px}a{color:#2c708d;text-underline-offset:3px}a:hover{color:#16676c}#sidebar{position:fixed;inset:0 auto 0 0;width:268px;padding:30px 18px;background:var(--ink);color:white;overflow:auto;z-index:20}.brand{font-size:11px;letter-spacing:2px;color:#acc7d3;margin:0 12px 12px}.sidebar-title{font-size:19px;line-height:1.65;font-weight:700;margin:0 12px 22px;padding-bottom:20px;border-bottom:1px solid #ffffff30;overflow-wrap:anywhere}#toc a{display:block;color:#cddfe7;text-decoration:none;font-size:13px;line-height:1.65;padding:9px 11px;margin:3px 0;border-left:3px solid transparent;border-radius:3px;overflow-wrap:anywhere}#toc a[data-depth="3"]{padding-left:25px;font-size:12px}#toc a:hover,#toc a:focus-visible{background:#ffffff12;color:white}#toc a[aria-current="location"]{background:#ffffff16;color:white;border-left-color:#68c6c9;font-weight:700}.sidebar-foot{font-size:11px;line-height:1.7;color:#a5c1cf;margin:24px 13px 0}#shell{max-width:1080px;background:var(--paper);min-height:100vh;margin:0 auto;box-shadow:0 0 24px #183b5010}#brief-header{padding:48px 56px 28px;border-top:6px solid var(--teal)}.kicker{font-size:12px;letter-spacing:2px;color:var(--teal);font-weight:700;margin-bottom:12px}h1{font-size:32px;line-height:1.5;color:var(--ink);margin:0 0 18px;overflow-wrap:anywhere}.header-rule{width:52px;height:3px;background:var(--teal)}#content{padding:0 56px 50px;overflow-wrap:anywhere}p{margin:0 0 18px}h2,h3,h4{color:var(--ink);scroll-margin-top:28px;break-after:avoid}h2{font-size:23px;line-height:1.6;margin:38px 0 18px;padding-top:24px;border-top:1px solid var(--line)}h3{font-size:19px;line-height:1.65;margin:28px 0 14px}h4{font-size:17px;margin:24px 0 12px}strong{color:var(--ink)}ul,ol{padding-left:1.6em;margin:0 0 20px}li{padding-left:3px;margin-bottom:7px}blockquote{margin:24px 0;padding:18px 22px;border-left:4px solid var(--teal);background:var(--pale);color:#42606f}blockquote p:last-child{margin-bottom:0}pre{margin:22px 0;padding:18px;background:var(--pale);font-size:13px;line-height:1.65;overflow:auto;border:1px solid var(--line);border-radius:4px}code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:.9em}p code,li code{background:var(--pale);padding:2px 4px;border-radius:3px}img{max-width:100%;height:auto;display:block;margin:20px auto}.table-scroll{overflow-x:auto;margin:24px 0;border:1px solid #becbd3;border-radius:2px}.result-table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.7;white-space:normal}.result-table th{background:var(--ink);color:white;padding:12px 14px;border:1px solid #527084;text-align:left;font-weight:700;min-width:100px}.result-table td{background:white;padding:12px 14px;border:1px solid #c6cfd5;vertical-align:top;min-width:95px}.result-table th[align="right"],.result-table td[align="right"]{text-align:right;font-variant-numeric:tabular-nums}.result-table th[align="center"],.result-table td[align="center"]{text-align:center}.result-table th:first-child,.result-table td:first-child{border-left:0}.result-table th:last-child,.result-table td:last-child{border-right:0}.result-table tr:last-child td{border-bottom:0}hr{border:0;border-top:1px solid var(--line);margin:30px 0}.footnotes{font-size:13px;color:var(--muted)}#brief-footer{padding:20px 56px 32px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);overflow-wrap:anywhere}#actions{position:fixed;top:14px;right:18px;z-index:25;display:flex;gap:8px}button{font:inherit;font-size:12px;border:1px solid #bdcdd6;background:white;color:var(--ink);padding:7px 12px;border-radius:4px;cursor:pointer;box-shadow:0 2px 8px #173f580d}button:hover{background:var(--pale)}#toc-toggle{display:none}:focus-visible{outline:3px solid #5cbbc0;outline-offset:3px}#shade{display:none}
@media(max-width:900px){html{scroll-padding-top:0}body{padding-left:0;padding-top:50px}#sidebar{display:none;width:min(310px,88vw);top:50px;box-shadow:8px 0 24px #173f5830}#sidebar.open{display:block}#toc-toggle{display:block}#actions{top:0;left:0;right:0;height:50px;align-items:center;justify-content:space-between;padding:0 16px;background:#edf2f5f5;border-bottom:1px solid var(--line)}#brief-header{padding:30px 24px 24px}h1{font-size:27px}#content{padding:0 24px 32px}h2{font-size:21px;scroll-margin-top:72px}h3{scroll-margin-top:72px}#brief-footer{padding:20px 24px}#shade.visible{display:block;position:fixed;inset:50px 0 0;background:#16344735;z-index:15}.result-table{font-size:13px}body{font-size:15px}.table-scroll{margin:20px 0}}
.result-table td[align="right"],.result-table td[style*="text-align: right"]{white-space:nowrap}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{@page{size:A4 portrait;margin:16mm 14mm}html{scroll-behavior:auto}body{padding:0;background:white;font-size:10.5pt;line-height:1.7;-webkit-print-color-adjust:exact;print-color-adjust:exact}#sidebar,#actions,#shade{display:none!important}#shell{max-width:none;min-height:0;box-shadow:none}#brief-header{padding:10px 0 20px;border-top:4px solid var(--teal)}h1{font-size:23pt}#content{padding:0}h2{font-size:16pt;margin-top:26px;padding-top:14px}h3{font-size:12.5pt}#brief-footer{display:none;padding:18px 0 0;font-size:8pt}.table-scroll{overflow:visible;border:0}.result-table{font-size:8.5pt;table-layout:fixed}.result-table th,.result-table td{min-width:0;padding:6px;overflow-wrap:anywhere}.result-table thead{display:table-header-group}.result-table tr,img,blockquote{break-inside:avoid}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:inherit}a[href]::after{content:none}}
</style>
</head>
<body>
<aside id="sidebar" aria-label="简报目录"><div class="brand">SURVEY ANALYSIS</div><div class="sidebar-title">{{TITLE}}</div><nav id="toc" aria-label="章节导航">{{TOC}}</nav><div class="sidebar-foot">统计结果与分析解读<br>详细数据以所附工作簿为准</div></aside>
<div id="shade" aria-hidden="true"></div>
<div id="actions"><button id="toc-toggle" aria-controls="sidebar" aria-expanded="false" type="button">目录</button><button id="print-button" type="button">打印 / 另存为 PDF</button></div>
<main id="shell"><header id="brief-header"><div class="kicker">问卷统计 · 分析简报</div>{{HEADLINE}}<div class="header-rule"></div></header><article id="content">{{CONTENT}}</article><footer id="brief-footer">正文来源：{{SOURCE_NAME}}</footer></main>
<script>
(() => {
 const sidebar=document.getElementById('sidebar'),toggle=document.getElementById('toc-toggle'),shade=document.getElementById('shade');
 const entries=[...document.querySelectorAll('#toc a')].map(link=>({link,heading:document.getElementById(decodeURIComponent(link.hash.slice(1)))})).filter(item=>item.heading);
 function openMenu(open){sidebar.classList.toggle('open',open);shade.classList.toggle('visible',open);toggle.setAttribute('aria-expanded',String(open));}
 toggle.addEventListener('click',()=>openMenu(!sidebar.classList.contains('open')));
 shade.addEventListener('click',()=>openMenu(false));
 entries.forEach(({link})=>link.addEventListener('click',()=>openMenu(false)));
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&sidebar.classList.contains('open')){openMenu(false);toggle.focus();}});
 function highlight(){if(!entries.length)return;const cutoff=innerWidth<=900?90:48;let selected=entries[0];for(const item of entries){if(item.heading.getBoundingClientRect().top<=cutoff)selected=item;else break;}if(scrollY+innerHeight>=document.documentElement.scrollHeight-3)selected=entries[entries.length-1];entries.forEach(item=>{if(item===selected)item.link.setAttribute('aria-current','location');else item.link.removeAttribute('aria-current');});}
 let waiting=false;addEventListener('scroll',()=>{if(!waiting){waiting=true;requestAnimationFrame(()=>{highlight();waiting=false;});}},{passive:true});
 addEventListener('resize',()=>{if(innerWidth>900)openMenu(false);highlight();});
 document.getElementById('print-button').addEventListener('click',()=>window.print());
 addEventListener('hashchange',highlight);highlight();
 document.fonts.ready.then(()=>document.documentElement.dataset.ready='true');
})();
</script>
</body>
</html>
