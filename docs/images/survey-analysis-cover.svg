<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title description">
  <title id="title">盒盒用户调研统计分析 Skill</title>
  <desc id="description">全量标记、用户决定纳入、总体与主要人群连续分析，再追查差异；分别交付可编辑Excel明细与Markdown、侧栏HTML简报。图中内容为能力与交付示意，不含真实样本。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfc"/><stop offset="1" stop-color="#eef4f5"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f53"/><stop offset="1" stop-color="#285f73"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#173f53" flood-opacity="0.07"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#88a9b7"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
      .ink{fill:#173f53}.muted{fill:#617b88}.white{fill:#fff}.teal{fill:#248b88}
      .body{font-size:20px}.small{font-size:17px}.step{font-size:26px;font-weight:700}
    </style>
  </defs>
  <rect width="1600" height="980" rx="20" fill="url(#paper)"/>
  <path d="M1418 0h182v254c-132-14-227-108-231-254Z" fill="#e1eeef"/>
  <circle cx="1536" cy="54" r="172" fill="none" stroke="#d2e4e8" stroke-width="2"/>
  <circle cx="1536" cy="54" r="120" fill="none" stroke="#d2e4e8" stroke-width="2"/>
  <rect x="60" y="52" width="8" height="30" rx="4" fill="#248b88"/>
  <text x="84" y="75" font-size="22" font-weight="700" class="teal">盒盒研究工具 · 2026.11.10</text>
  <text x="60" y="146" font-size="54" font-weight="700" class="ink">用户调研统计分析 Skill</text>
  <text x="62" y="194" font-size="25" class="muted">保留完整样本，连续比较重要人群，把差异写成有依据的分析。</text>
  <rect x="1170" y="130" width="367" height="48" rx="24" fill="#fff" stroke="#c8dce2"/>
  <text x="1353" y="161" text-anchor="middle" font-size="19" font-weight="700" class="ink">输入 Excel · CSV · SAV</text>

  <!-- 五个可核对的执行阶段 -->
  <g filter="url(#shadow)">
    <rect x="60" y="250" width="272" height="192" rx="13" fill="#fff" stroke="#d3e2e7"/>
    <rect x="362" y="250" width="272" height="192" rx="13" fill="#fff" stroke="#d3e2e7"/>
    <rect x="664" y="250" width="272" height="192" rx="13" fill="url(#navy)"/>
    <rect x="966" y="250" width="272" height="192" rx="13" fill="#fff" stroke="#d3e2e7"/>
    <rect x="1268" y="250" width="272" height="192" rx="13" fill="#e6f3ef" stroke="#badbd3"/>
  </g>
  <g class="muted" font-size="19" font-weight="700">
    <text x="82" y="285">01</text><text x="384" y="285">02</text><text x="686" y="285" fill="#acd3db">03</text><text x="988" y="285">04</text><text x="1290" y="285">05</text>
  </g>
  <g class="ink step">
    <text x="82" y="329">全量质量标记</text><text x="384" y="329">用户决定纳入</text><text x="686" y="329" fill="#fff">总体＋主要维度</text><text x="988" y="329">继续追查差异</text><text x="1290" y="329">Excel 与简报</text>
  </g>
  <g class="body muted">
    <text x="82" y="370">明确无效 · 证据不足</text><text x="82" y="402">合格记录同样保留标记</text>
    <text x="384" y="370">记录证据和纳入建议</text><text x="384" y="402">沿用用户确认的统计范围</text>
    <text x="686" y="370" fill="#d8e9ed">同一组人群</text><text x="686" y="402" fill="#d8e9ed">连续查看可比题目</text>
    <text x="988" y="370">结合条件与其他答案</text><text x="988" y="402">说明差异与业务含义</text>
    <text x="1290" y="370">明细用于查数、继续分析</text><text x="1290" y="402">简报用于阅读、沟通结论</text>
  </g>
  <g stroke="#88a9b7" stroke-width="2" marker-end="url(#arrow)">
    <path d="M338 346h15"/><path d="M640 346h15"/><path d="M942 346h15"/><path d="M1244 346h15"/>
  </g>

  <!-- 统计明细示意 -->
  <rect x="60" y="486" width="894" height="368" rx="14" fill="#fff" stroke="#d3e2e7" filter="url(#shadow)"/>
  <rect x="84" y="510" width="38" height="38" rx="8" fill="#e6f3ef"/>
  <g stroke="#248b88" fill="none" stroke-width="2"><rect x="94" y="520" width="18" height="18" rx="1"/><path d="M94 526h18M100 520v18M106 520v18M94 532h18"/></g>
  <text x="135" y="537" font-size="26" font-weight="700" class="ink">可编辑 Excel：总体旁边，直接看人群差异</text>
  <text x="84" y="572" class="small muted">使用说明 → 分析方案 → 数据分析结论 → 原题模块与专题</text>
  <rect x="84" y="598" width="846" height="44" fill="#264863"/>
  <g class="small white" font-weight="700">
    <text x="100" y="626">题目／指标</text><text x="539" y="626" text-anchor="middle">总体</text><text x="687" y="626" text-anchor="middle">主要人群 A</text><text x="847" y="626" text-anchor="middle">主要人群 B</text>
  </g>
  <g stroke="#d3dde2" stroke-width="1">
    <path d="M84 642H930M84 684H930M84 726H930M84 768H930M84 810H930M84 642V810M476 598V810M602 598V810M772 598V810M930 598V810"/>
  </g>
  <g class="small ink">
    <text x="100" y="669">画像与使用条件</text><text x="100" y="711">实际行为与问题</text><text x="100" y="753">评价、需求与购买</text><text x="100" y="795" font-weight="700">逐题有效样本量</text>
  </g>
  <g fill="#bfd3dc"><rect x="507" y="658" width="64" height="10" rx="5"/><rect x="507" y="700" width="64" height="10" rx="5"/><rect x="507" y="742" width="64" height="10" rx="5"/></g>
  <g fill="#248b88"><rect x="637" y="658" width="100" height="10" rx="5"/><rect x="637" y="700" width="100" height="10" rx="5"/><rect x="637" y="742" width="100" height="10" rx="5"/></g>
  <g fill="#91acbd"><rect x="797" y="658" width="100" height="10" rx="5"/><rect x="797" y="700" width="100" height="10" rx="5"/><rect x="797" y="742" width="100" height="10" rx="5"/></g>
  <g class="small muted" text-anchor="middle"><text x="539" y="795">n</text><text x="687" y="795">n</text><text x="847" y="795">n</text></g>

  <!-- 连续阅读简报示意 -->
  <rect x="980" y="486" width="560" height="368" rx="14" fill="#fff" stroke="#d3e2e7" filter="url(#shadow)"/>
  <text x="1004" y="537" font-size="26" font-weight="700" class="ink">Markdown ＋ 侧栏 HTML</text>
  <text x="1004" y="572" class="small muted">对象、差值、解释与建议，连贯写清楚</text>
  <rect x="1004" y="598" width="512" height="212" rx="6" fill="#f7fafb" stroke="#d9e4e8"/>
  <path d="M1010 598H1147V810H1010a6 6 0 0 1-6-6V604a6 6 0 0 1 6-6Z" fill="#173f53"/>
  <text x="1021" y="627" class="small white" font-weight="700">分析简报</text>
  <g font-size="15" fill="#dce9ed"><text x="1021" y="667">整体情况</text><text x="1021" y="701">重要人群差异</text><text x="1021" y="735">进一步分析</text><text x="1021" y="769">结论与建议</text></g>
  <rect x="1013" y="680" width="123" height="31" rx="4" fill="#2e667a"/>
  <text x="1021" y="701" font-size="15" font-weight="700" fill="#fff">重要人群差异</text>
  <text x="1168" y="633" font-size="21" font-weight="700" class="ink">差异集中在哪些方面</text>
  <rect x="1168" y="653" width="315" height="4" rx="2" fill="#248b88"/>
  <g fill="#c1d1d9"><rect x="1168" y="678" width="315" height="7" rx="3"/><rect x="1168" y="696" width="315" height="7" rx="3"/><rect x="1168" y="714" width="247" height="7" rx="3"/></g>
  <rect x="1168" y="741" width="315" height="47" rx="5" fill="#e6f3ef"/>
  <text x="1182" y="770" font-size="16" font-weight="700" class="teal">分析发现 → 业务含义 → 可采取的动作</text>

  <path d="M60 894H1540" stroke="#cadde3"/>
  <text x="60" y="931" font-size="20" font-weight="700" class="ink">hehe-survey-analysis-workbook</text>
  <text x="60" y="957" font-size="17" class="muted">独立可用 · 问卷与字段字典即可衔接 · 无需另装问卷设计或报告 Skill</text>
  <text x="1540" y="931" text-anchor="end" font-size="17" class="muted">能力与交付示意 · 不含真实样本</text>
  <text x="1540" y="957" text-anchor="end" font-size="17" class="teal">github.com/hexiaofeier/hehe-survey-analysis-workbook</text>
</svg>
